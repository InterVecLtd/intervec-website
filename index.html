<style>
:root{
  --teal:#1e7ca1; --teal-deep:#17607d; --green:#69ba34; --green-deep:#4f9a25;
  --ink:#0f2e45; --ink-soft:#4a6578; --sky:#f2f7fa; --line:#d5e3ec; --white:#fff;
  --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:94px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:'Commissioner',system-ui,sans-serif;color:var(--ink);background:var(--white);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal-deep)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:78px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.mark img{display:block;height:52px;width:auto}
nav{display:flex;gap:18px;margin-left:auto}
nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem;white-space:nowrap}
nav a:hover{color:var(--teal)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--white)}
.lang button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
@media (max-width:1240px){nav{display:none}.lang{margin-left:auto}}

/* Intro + directory */
.intro{background:var(--sky);padding:72px 0 64px;border-bottom:1px solid var(--line)}
.intro h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:18ch}
.intro p{margin-top:20px;font-size:1.15rem;max-width:62ch;color:var(--ink-soft)}
.dir{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:52px;border-top:2px solid var(--ink)}
.dir > div{padding:22px 22px 6px 0}
.dir > div + div{padding-left:22px;border-left:1px solid var(--line)}
.dir h2{font-size:1.05rem;font-weight:700;color:var(--teal-deep);margin-bottom:10px}
.dir ul{list-style:none}
.dir a{display:block;padding:7px 0;text-decoration:none;color:var(--ink);font-weight:500;border-bottom:1px solid var(--line)}
.dir li:last-child a{border-bottom:0}
.dir a:hover{color:var(--teal)}
@media (max-width:1100px){.dir{grid-template-columns:1fr 1fr 1fr}.dir > div:nth-child(4){padding-left:0;border-left:0}}@media (max-width:860px){.dir{grid-template-columns:1fr}.dir > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}

/* Groups & entries */
.group{padding:80px 0 24px}
.group + .group{border-top:1px solid var(--line)}
.group > .wrap > h2{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.025em;font-weight:700;line-height:1.1;margin-bottom:8px}
.group > .wrap > p{color:var(--ink-soft);max-width:60ch;margin-bottom:28px}
.entry{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:48px;padding:40px 0;border-top:1px solid var(--line)}
.entry h3{font-size:1.45rem;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.entry .badge{display:inline-block;margin-top:14px;font-size:.88rem;font-weight:500;color:var(--green-deep);background:#ecf7e9;border-radius:6px;padding:4px 10px}
.entry .desc{font-size:1.08rem;max-width:66ch}
.entry h4{font-size:.92rem;font-weight:600;color:var(--ink-soft);margin:22px 0 8px}
.entry ul.inc{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.entry ul.inc li{padding-left:18px;position:relative}
.entry ul.inc li::before{content:"";position:absolute;left:0;top:.66em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.partners{display:flex;flex-wrap:wrap;gap:10px}
.partners span{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.95rem;background:var(--sky)}
.partners span small{display:block;color:var(--ink-soft);font-size:.82rem}
@media (max-width:860px){.entry{grid-template-columns:1fr;gap:14px}.entry ul.inc{grid-template-columns:1fr}}

/* About */
.about{background:var(--ink);color:#dfeaf2;padding:72px 0}
.about h2{color:#fff;font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.025em;margin-bottom:28px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;max-width:900px}
.facts strong{display:block;color:#fff;font-size:1.2rem;margin-bottom:6px}
.facts p{color:#b6cad8;font-size:.98rem}
@media (max-width:860px){.facts{grid-template-columns:1fr}}

/* Contact */
#contact{padding:80px 0}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:56px}
.contact h2{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.025em;margin-bottom:24px}
dl{display:grid;gap:18px}
dt{font-size:.9rem;color:var(--ink-soft)}
dd{font-size:1.15rem;font-weight:600}
dd a{text-decoration:none}
form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:6px;font-size:.92rem;font-weight:500}
input,select,textarea{font:inherit;font-size:1rem;padding:12px 14px;border:1px solid #b9cfdd;border-radius:9px;background:var(--sky);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff}
.btn{font:inherit;font-weight:600;padding:14px 24px;border-radius:10px;border:0;background:var(--teal);color:#fff;cursor:pointer;justify-self:start}
.btn:hover{background:var(--teal-deep)}
.note{font-size:.92rem;color:var(--ink-soft)}
.done{display:none;padding:14px 16px;border-radius:9px;background:#e9f6e6;border:1px solid #bfe3b7}
.done.show{display:block}
@media (max-width:860px){.contact{grid-template-columns:1fr}.row{grid-template-columns:1fr}}

footer{background:var(--ink);color:#b6cad8;padding:36px 0;font-size:.95rem}
.foot{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
footer a{color:#fff}
</style>

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'el';

function render(){
  const L = lang;
  document.querySelectorAll('[data-t]').forEach(n => { const v = T[n.dataset.t]; if (v) n.textContent = v[L]; });
  document.getElementById('nav').innerHTML =
    GROUPS.map(g => `<a href="#${g.id}">${esc(g.t[L])}</a>`).join('') +
    `<a href="#contact">${T.navContact[L]}</a>`;
  document.getElementById('dir').innerHTML = GROUPS.map(g =>
    `<div><h2>${esc(g.t[L])}</h2><ul>${g.items.map(i => `<li><a href="#${i.id}">${esc(i.t[L])}</a></li>`).join('')}</ul></div>`).join('');
  document.getElementById('groups').innerHTML = GROUPS.map(g => `
    <section class="group" id="${g.id}"><div class="wrap">
      <h2>${esc(g.t[L])}</h2><p>${esc(g.d[L])}</p>
      ${g.items.map(i => `
        <article class="entry" id="${i.id}">
          <div><h3>${esc(i.t[L])}</h3></div>
          <div>
            <p class="desc">${esc(i.d[L])}</p>
            <h4>${T.inc[L]}</h4>
            <ul class="inc">${i.inc[L].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
            ${i.apps ? `<h4>${T[i.appsLabel || 'apps'][L]}</h4><p>${esc(i.apps[L])}</p>` : ''}
          </div>
        </article>`).join('')}
    </div></section>`).join('');
  document.getElementById('topic').innerHTML =
    GROUPS.flatMap(g => g.items).map(i => `<option>${esc(i.t[L])}</option>`).join('') + `<option>${T.other[L]}</option>`;
  document.documentElement.lang = L;
  document.title = L === 'en' ? 'InterVec Ltd — Engineering Energy' : 'InterVec Ltd — Ενεργειακή τεχνολογία';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === L));
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('iv-lang', lang); } catch(e){} render();
}));
try { if (localStorage.getItem('iv-lang') === 'en') lang = 'en'; } catch(e){}
render();
if (location.hash) { const el = document.querySelector(location.hash.replace(/[^#\w-]/g,'')); if (el) el.scrollIntoView(); }
document.getElementById('yr').textContent = new Date().getFullYear();

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = k => f.elements[k].value.trim();
  if (!v('name')) { f.elements.name.focus(); return; }
  const subj = 'InterVec — ' + v('topic') + ' — ' + v('name');
  const body = [v('msg'), '', v('name'), v('phone'), v('email')].join('\n');
  window.location.href = 'mailto:info@intervec.com.cy?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  document.getElementById('done').classList.add('show');
});
